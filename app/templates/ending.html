    {% extends 'base.html' %}

    {% block scene_results %}

    <!-- using same naming conventions as scene template for css -->
    <div class = "scene">
        <h2 class = "storyDescAndQ" id = "typed"> </h2>
        <img class = "storyImg" src = "{{ scene_data['image'] }}"/>

        <div>
            <h2 class = "storyDescAndQ"> {{ scene_data['_comment'] }} </h2>
        </div>

        <div class = "choices">
            <div class = "choiceButton">
                <a class = "choiceButtonText" href = "/choose_char.html">Try Again?</a>
            </div>
            <div class = "choiceButton">
                <a class = "choiceButtonText" href = "/home.html">Home</a>
            </div>
        </div>
    </div>

    <!-- developed from w3 schools https://www.w3schools.com/howto/howto_js_typewriter.asp -->
    <script>
        var i = 0;
        var speed = 105;
        const txt = {{ scene_data['title'] | tojson }};

        function typeWriter() {
            // add more pause after punctuation?
            if (i < txt.length) {
                document.getElementById("typed").innerHTML += txt.charAt(i);
                i++;
                setTimeout(typeWriter, speed);
            }
        }

        typeWriter();

    </script>

    {% endblock %}
