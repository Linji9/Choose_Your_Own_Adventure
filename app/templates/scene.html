{% extends 'base.html' %}

{% block scene_results %}
<div class = "scene">
    <div class="storyDescAndImage">
        <!-- getting scene description -->
         <!-- from w3 schools -->
        <h2 class = "storyDescAndQ" id = "demo"> </h2>
        <button onclick="typeWriter()">Click me</button>

        <!-- getting scene image -->
        <img class = "storyImg" src = "{{ scene_data['image'] }}"/>
    </div>

    <div>
        <!-- getting scene question -->
        <h2 class = "storyDescAndQ"> {{ scene_data['question'] }} </h2>
    </div>

<div class = "choices">
<!-- looping through each choice -->
{% for key, value in scene_data['choices'].items() %}

    <!-- creating a button for each choice that will lead to the next scene when clicked -->
    <div class = "choiceButton">
        <a class = "choiceButtonText" href = "/scene/{{char}}/{{value}}"> {{ key }} </a>
    </div>

{% endfor %}
</div>
</div>
<!-- from w3 schools -->
<script>
    var i = 0;
    var txt = {{ scene_data['description'] }};
    var speed = 50;

    function typeWriter() {
        if (i < txt.length) {
            document.getElementById("demo").innerHTML += txt.charAt(i);
            i++;
            setTimeout(typeWriter, speed);
        }
    }
</script>
{% endblock %}
