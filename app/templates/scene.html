{% extends 'base.html' %}

{% endblock %} -->

{% block scene_results %}

<div class = "scene">
    <div class="storyDescAndImage">
        <!-- getting scene description, should appear as being typed -->
        <h2 class = "storyDescAndQ" id = "typed"> </h2>
        <!-- getting scene image -->
        <img class = "storyImg" src = "{{ scene_data['image'] }}"/>
    </div>

    <div>
        <!-- getting scene question -->
        <h2 class = "storyDescAndQ"> {{ scene_data['question'] }} </h2>
    </div>

<div class = "choices">
<!-- looping through each choice -->
{% for key, value in scene_data['choices'].items() %}

    <!-- creating a button for each choice that will lead to the next scene when clicked -->
    <div class = "choiceButton">
        <a class = "choiceButtonText" href = "/scene/{{char}}/{{value}}"> {{ key }} </a>
    </div>

{% endfor %}
</div>
</div>

<!-- developed from w3 schools https://www.w3schools.com/howto/howto_js_typewriter.asp -->
<script>
    var i = 0;
    var speed = 50;
    const txt = {{ scene_data['description'] | tojson }};

    function typeWriter() {
        // make slower,
        // add more pause after punctuation
        if (i < txt.length) {
            document.getElementById("typed").innerHTML += txt.charAt(i);
            i++;
            setTimeout(typeWriter, speed);
        }
    }

    typeWriter();

</script>
{% endblock %}
