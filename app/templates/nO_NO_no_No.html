<html>
    <head>
        <title> nO NO no No </title>
        <link rel="stylesheet" href="static/css/style.css"/>
    </head>
    <body>
        {% block content %}
        <div class = "backPage">
        <h1 class = "textBack"> {{ msg }} </h1>
        <img class = "imageBack" src="/static/img/{{ person }}.png"/>
        </div>
        {% endblock %}
        <script>
            // stop user from hitting the back button
            window.history.pushState({ page: 1 }, '', window.location.href);
            window.addEventListener('popstate', function (event) {
                window.location.href = '/nO_NO_no_No';
            })
        </script>
    </body>
</html>
